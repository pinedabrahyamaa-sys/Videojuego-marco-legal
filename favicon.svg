<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14284b"/>
      <stop offset="50%" stop-color="#0d1e38"/>
      <stop offset="100%" stop-color="#081324"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe17d"/>
      <stop offset="50%" stop-color="#f0c24b"/>
      <stop offset="100%" stop-color="#c99726"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Sombra del escudo -->
  <path d="M16 2.5 L27 6.2 C27 18 22 25.5 16 29.8 C10 25.5 5 18 5 6.2 Z" 
        fill="rgba(0,0,0,0.4)" transform="translate(0, 1)"/>

  <!-- Cuerpo del escudo institucional -->
  <path d="M16 2.5 L27 6.2 C27 18 22 25.5 16 29.8 C10 25.5 5 18 5 6.2 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="1.6" 
        stroke-linejoin="round"/>

  <!-- Círculo interior pericial (halo forense) -->
  <circle cx="16" cy="16" r="8.5" 
          fill="#102548" 
          stroke="url(#goldGrad)" 
          stroke-width="0.7" 
          stroke-dasharray="1.8 1.2" 
          opacity="0.75"/>

  <!-- Balanza de la Justicia estilizada (emblema pericial) -->
  <g id="justice-scale" filter="url(#glow)">
    <!-- Base de la balanza -->
    <path d="M12.5 23 L19.5 23" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round"/>
    
    <!-- Columna central -->
    <line x1="16" y1="9.5" x2="16" y2="23" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linecap="round"/>
    
    <!-- Remate superior -->
    <circle cx="16" cy="9.2" r="1.1" fill="url(#goldGrad)"/>

    <!-- Viga / brazo horizontal -->
    <path d="M10 12 L22 12" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Platillo izquierdo -->
    <path d="M10 12 L8.2 16 M10 12 L11.8 16" stroke="#f0c24b" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M7.8 16 Q10 18 12.2 16 Z" fill="url(#goldGrad)"/>

    <!-- Platillo derecho -->
    <path d="M22 12 L20.2 16 M22 12 L23.8 16" stroke="#f0c24b" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M19.8 16 Q22 18 24.2 16 Z" fill="url(#goldGrad)"/>

    <!-- Estrella pericial superior -->
    <polygon points="16,4.6 16.7,6.4 18.5,6.4 17.1,7.5 17.6,9.2 16,8.1 14.4,9.2 14.9,7.5 13.5,6.4 15.3,6.4" 
             fill="#ffe58f" transform="scale(0.55) translate(13, 0)"/>
  </g>
</svg>
